# Smoke run of the paper benchmark scripts (OpenML datasets, pinned research stack). Manual or monthly,
# never blocking: it depends on OpenML being up and on the research scripts, not on the library.
name: Paper benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 1 * *"  # 1st of the month

jobs:
  benchmark:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        task: [classification, regression]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-benchmark.txt
          python -m pip install --no-deps -e .
          mkdir -p ~/.config/openml
      - if: matrix.task == 'classification'
        run: python ./run_benchmark.py --model DecisionTreeClassifier --data 0
      - if: matrix.task == 'regression'
        run: python ./run_benchmark_weighted_pdr.py --quicktest
