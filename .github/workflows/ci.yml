# Unit tests on the oldest supported, the widely deployed (Kaggle, Colab) and the latest dependency versions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "oldest: py3.9 numpy 1.23 pandas 1.5 sklearn 1.2"
            os: ubuntu-latest
            python: "3.9"
            pins: "numpy==1.23.5 pandas==1.5.3 scikit-learn==1.2.2 scipy==1.9.3"
          - name: "Kaggle-like: py3.11 numpy 1.26 pandas 2.2 sklearn 1.2"
            os: ubuntu-latest
            python: "3.11"
            pins: "numpy==1.26.4 pandas==2.2.3 scikit-learn==1.2.2 scipy==1.11.4"
          - name: "py3.11 sklearn 1.5 (last release before the new tags API)"
            os: ubuntu-latest
            python: "3.11"
            pins: "numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 scipy==1.13.1"
          - name: "Colab-like: py3.12 numpy 2.0 pandas 2.2 sklearn 1.6"
            os: ubuntu-latest
            python: "3.12"
            pins: "numpy==2.0.2 pandas==2.2.2 scikit-learn==1.6.1 scipy==1.14.1"
          - name: "paper reproduction: stack of the golden files"
            os: ubuntu-latest
            python: "3.12"
            pins: "numpy==2.5.4 pandas==3.0.6 scikit-learn==1.9.1 scipy==1.18.1"
          - name: "latest: py3.13 + coverage + slow tests"
            os: ubuntu-latest
            python: "3.13"
            pins: ""
            full: true
          - name: "latest: py3.14"
            os: ubuntu-latest
            python: "3.14"
            pins: ""
          - name: "latest: Windows"
            os: windows-latest
            python: "3.13"
            pins: ""
          - name: "latest: macOS"
            os: macos-latest
            python: "3.13"
            pins: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.pins }} -e ".[test]"
          python -c "import sys, numpy, pandas, sklearn, scipy; print(sys.version); print('numpy', numpy.__version__, 'pandas', pandas.__version__, 'scikit-learn', sklearn.__version__, 'scipy', scipy.__version__)"
      - name: Unit, golden and scikit-learn conformance tests
        if: ${{ !matrix.full }}
        run: python -m pytest -m "not network and not e2e and not slow" -q -rfEs
      - name: All offline tests with coverage
        if: ${{ matrix.full }}
        run: python -m pytest -m "not network and not e2e" -q -rfEs --cov --cov-report=term-missing:skip-covered --cov-fail-under=90

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a clean environment and run the examples
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "import pdll; print(pdll.__version__); print(pdll.__citation__)"
          for example in quickstart multiclass_classification regression weighted_regression uncertainty; do
            echo "::group::$example"; /tmp/clean/bin/python $GITHUB_WORKSPACE/examples/$example.py; echo "::endgroup::"
          done
